<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Management System</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .dashboard-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 30px; }
        .btn-group { display: flex; flex-direction: column; gap: 12px; }
        .api-link {
            display: block;
            padding: 12px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .api-link:hover { background-color: #2980b9; }
        .api-link.admin { background-color: #2ecc71; }
        .api-link.admin:hover { background-color: #27ae60; }
    </style>
</head>
<body>

<div class="dashboard-card">
    <h1>🏥 Hospital Management System</h1>
    <p>Authentication Successful. Welcome to the central backend API registry node.</p>

    <div class="btn-group">
        <a href="/patients/profile" class="api-link">View My Patient Profile (JSON)</a>
        <a href="/admin/patients" class="api-link admin">Go to Admin Patients Registry</a>
    </div>
</div>

</body>
</html>
